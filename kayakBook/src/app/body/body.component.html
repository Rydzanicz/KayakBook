<div class="container">
  <div class="content">
    <img src="assets/auto.png" alt="Auto" class="image"/>
    <p class="title">Zapraszamy na przygodę i możliwość wybrania jednej z trzech tras!</p>

    <div class="routes">
      <button
        class="route btn"
        *ngFor="let trace of traces"
        [routerLink]="['/trace', trace.id]"
        [attr.aria-label]="'Navigate to route ' + trace.id">
        Trasa  {{ trace.description }}
      </button>
    </div>
  </div>
</div>
