<div class="container">
  <div class="content">
    <div class="filters-wrapper">
      <app-filters (filtersChanged)="onFiltersChanged($event)"></app-filters>
    </div>

    <div class="table-wrapper">
      <app-table-container
        [data]="tableData"
        (rowClicked)="onRowClicked($event)">
      </app-table-container>
      <div *ngIf="loading" class="loading-more">Ładowanie kolejnych danych...</div>

      <div *ngIf="!hasMoreData && tableData.length > 0" class="all-data-loaded">
        Wszystkie dane zostały załadowane.
      </div>
    </div>
  </div>
</div>
