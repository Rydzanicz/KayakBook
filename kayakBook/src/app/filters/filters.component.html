<div class="filters-container">
  <div class="form-group">
    <label for="startDate">Data początkowa:</label>
    <input
      id="startDate"
      type="date"
      [(ngModel)]="startDate"
      class="form-control"
    />
  </div>

  <div class="form-group">
    <label for="endDate">Data końcowa:</label>
    <input
      id="endDate"
      type="date"
      [(ngModel)]="endDate"
      class="form-control"
    />
  </div>

  <div class="form-group">
    <label>
      <input
        type="checkbox"
        [(ngModel)]="isFuture"
      />
      Tylko rejestracje przyszłe
    </label>
  </div>

  <button (click)="applyFilters()" class="apply-button">Zastosuj filtry</button>
</div>
